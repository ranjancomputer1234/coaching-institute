<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RACI admin — how each function works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f5fb;
        --text: #1b2559;
        --muted: #8b93ab;
        --blue: #3d5afe;
        --orange: #ff8a1a;
        --green: #1fa971;
        --line: #e6ebf5;
        --shadow: 0 10px 28px rgba(27, 37, 89, 0.06);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse 70% 40% at 0% -8%, #e7edff 0%, transparent 52%),
          radial-gradient(ellipse 50% 36% at 100% 0%, #e6f8ee 0%, transparent 46%),
          var(--bg);
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .app {
        display: grid;
        grid-template-columns: 300px 1fr;
        min-height: 100vh;
        gap: 16px;
        padding: 16px;
      }
      .side, .stage {
        background: #fff;
        border-radius: 24px;
        box-shadow: var(--shadow);
      }
      .side {
        padding: 18px 14px 14px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 32px);
        position: sticky;
        top: 16px;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 4px 8px 12px;
      }
      .mark {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(160deg, #6d8bff, #3d5afe);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        box-shadow: 0 8px 16px rgba(61, 90, 254, 0.28);
        flex: none;
      }
      .brand strong { display: block; font-size: 1.05rem; letter-spacing: -0.03em; }
      .brand small { color: var(--muted); font-weight: 600; }
      .brand em {
        display: block;
        width: 46px;
        height: 3px;
        margin-top: 4px;
        border-radius: 99px;
        background: linear-gradient(90deg, #3d5afe, #1b2559);
      }
      .search {
        margin: 4px 6px 10px;
        background: #f4f6fb;
        border-radius: 999px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        box-shadow: inset 0 0 0 1px #e7ecf6;
      }
      .search input {
        border: 0;
        background: transparent;
        width: 100%;
        padding: 10px 8px;
        outline: none;
        color: var(--text);
      }
      .progress {
        margin: 0 8px 10px;
        background: #e8efff;
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 0.82rem;
        font-weight: 700;
      }
      .progress span { color: var(--blue); }
      .bar {
        height: 6px;
        background: #fff;
        border-radius: 99px;
        margin-top: 8px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--blue);
        width: 0;
      }
      .nav {
        overflow: auto;
        padding: 0 4px 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group-label {
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
        margin: 8px 8px 4px;
      }
      .fn {
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        border-radius: 12px;
        padding: 8px 10px;
        color: var(--text);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        font-weight: 650;
        font-size: 0.92rem;
      }
      .fn:hover { background: #f5f7ff; }
      .fn.active { background: #e8edff; color: var(--blue); }
      .fn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d5dced;
        flex: none;
      }
      .fn.learned .dot { background: var(--green); }
      .stage { padding: 22px 26px 32px; min-width: 0; }
      .kicker { margin: 0; color: var(--muted); font-weight: 700; font-size: 0.88rem; }
      h1 {
        margin: 4px 0 0;
        font-size: 2rem;
        letter-spacing: -0.04em;
        font-weight: 800;
      }
      h1::after {
        content: "";
        display: block;
        width: 84px;
        height: 4px;
        margin-top: 8px;
        border-radius: 99px;
        background: linear-gradient(90deg, #3d5afe, #1b2559);
      }
      .lead { color: #5c678a; max-width: 68ch; line-height: 1.55; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
      .chip {
        border: 0;
        background: #eef2fb;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 700;
        font-size: 0.85rem;
      }
      .chip.on { background: #e8edff; color: var(--blue); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .card {
        text-align: left;
        border: 0;
        background: #f7f8fc;
        border-radius: 18px;
        padding: 14px;
        box-shadow: var(--shadow);
        color: inherit;
      }
      .card strong { display: block; margin-bottom: 4px; }
      .card small { color: var(--muted); line-height: 1.4; display: block; }
      .card .tag {
        display: inline-block;
        margin-bottom: 8px;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--blue);
      }
      .layout {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 16px;
        align-items: start;
      }
      .panel {
        background: #fff;
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 16px;
        border: 1px solid #f0f3fa;
      }
      .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
      .pill {
        background: #e8efff;
        color: #2f49d6;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.75rem;
        font-weight: 800;
      }
      .pill.path { background: #f4f6fb; color: #5c678a; }
      .steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .steps button {
        text-align: left;
        border: 0;
        background: #f6f8ff;
        border-radius: 14px;
        padding: 10px 12px;
        color: var(--text);
      }
      .steps button.on { background: #e8edff; box-shadow: inset 3px 0 0 var(--blue); }
      .steps button b { display: block; }
      .steps button span { color: var(--muted); font-size: 0.8rem; }
      .say { line-height: 1.55; margin-top: 0; }
      .watch {
        background: #fff6ea;
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 0.88rem;
        margin-top: 12px;
      }
      .mock {
        background: #f4f6fb;
        border-radius: 18px;
        padding: 12px;
      }
      .mock-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .mock-top strong { font-size: 0.95rem; }
      .mock-screen {
        background: #fff;
        border-radius: 16px;
        padding: 14px;
        min-height: 220px;
      }
      .mock-screen h3 { margin: 0 0 6px; font-size: 1.05rem; }
      .mock-screen p { margin: 0 0 12px; color: var(--muted); font-size: 0.86rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        background: var(--orange);
        color: #fff;
        font-weight: 800;
        box-shadow: 0 8px 16px rgba(255, 138, 26, 0.22);
      }
      .btn.ghost {
        background: #fff;
        color: var(--blue);
        border: 1.5px solid #d5def8;
        box-shadow: none;
      }
      .btn.danger { background: #e15d55; box-shadow: none; }
      .btn.good { outline: 3px solid #b7f0d4; }
      .hint {
        margin-top: 12px;
        min-height: 2.6em;
        font-size: 0.88rem;
        font-weight: 650;
      }
      .hint.ok { color: var(--green); }
      .hint.no { color: #c2413b; }
      .quiz { margin-top: 14px; }
      .quiz button {
        display: block;
        width: 100%;
        text-align: left;
        margin-top: 8px;
        border-radius: 12px;
        border: 1px solid #e6ebf5;
        background: #fff;
        padding: 10px 12px;
        color: var(--text);
        font-weight: 650;
      }
      .quiz button.right { background: #e5f8ee; border-color: #b7e7cd; }
      .quiz button.wrong { background: #fdecec; border-color: #f3c0bc; }
      .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
      .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      .legend i {
        font-style: normal;
        font-size: 0.75rem;
        font-weight: 800;
        border-radius: 999px;
        padding: 4px 8px;
      }
      .lg-o { background: #fff1e0; color: #c56a00; }
      .lg-b { background: #e8edff; color: #2f49d6; }
      .lg-r { background: #fdecec; color: #c2413b; }
      @media (max-width: 980px) {
        .app { grid-template-columns: 1fr; }
        .side { position: static; max-height: none; }
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <div class="mark">R</div>
          <div>
            <strong>RACI admin guide</strong>
            <small>Ranjan Educational Institute</small>
            <em></em>
          </div>
        </div>
        <label class="search">
          <input id="q" type="search" placeholder="Search a function…" autocomplete="off" />
        </label>
        <div class="progress">
          Practiced <span id="count">0</span> of <span id="total">0</span>
          <div class="bar"><i id="bar"></i></div>
        </div>
        <nav class="nav" id="nav" aria-label="Functions"></nav>
      </aside>
      <main class="stage" id="stage"></main>
    </div>
    <script>
      const GROUPS = [
        {
          id: "overview",
          label: "Overview",
          items: [
            {
              id: "dashboard",
              title: "Dashboard",
              path: "/",
              permission: "Any signed-in staff member",
              summary:
                "The home screen is the institute at a glance. It counts learners, published courses, explore sections, and banners, then points at work that is waiting.",
              learner:
                "Learners never see this screen. The numbers describe what they can already open in the app.",
              watch:
                "A card is a shortcut. Refresh pulls the latest counts. The yellow environment ribbon means this is not production.",
              quiz: {
                prompt: "Suspended learners are waiting. Where do you start?",
                choices: [
                  { text: "Action queues, then the suspended card", ok: true, why: "The queue names the problem and opens the filtered learner list." },
                  { text: "Settings, and turn the account provider off", ok: false, why: "Settings does not suspend people. Learners does." },
                  { text: "Audit log, and delete the event", ok: false, why: "The audit log only records what already happened." },
                ],
              },
              steps: [
                {
                  title: "Read the counts",
                  say: "Hello is the greeting. The four pastel cards are live totals. Click a card to open that list.",
                  screen: "Dashboard",
                  blurb: "Learners, courses, explore sections, and banners.",
                  controls: [
                    { label: "Learners card", kind: "ghost", correct: true },
                    { label: "Refresh", kind: "ghost", hint: "Refresh updates the numbers. Open a card when you want the list." },
                  ],
                },
                {
                  title: "Open a queue",
                  say: "Action queues list suspended accounts, draft courses, and learners waiting for verification.",
                  screen: "Action queues",
                  blurb: "Items that need a person.",
                  controls: [
                    { label: "Review learners", kind: "primary", correct: true },
                    { label: "New course", kind: "ghost", hint: "New course starts content. The queue is for accounts that are already blocked." },
                  ],
                },
                {
                  title: "Check who changed what",
                  say: "Recent admin activity shows the latest audit events. Open the full log when you need a name, a time, and an action.",
                  screen: "Recent admin activity",
                  blurb: "Latest audit events.",
                  controls: [
                    { label: "Open full audit log", kind: "ghost", correct: true },
                    { label: "Explore", kind: "primary", hint: "Explore jumps to courses. The activity list is the audit shortcut." },
                  ],
                },
              ],
            },
          ],
        },
        {
          id: "people",
          label: "People",
          items: [
            {
              id: "learners",
              title: "Learners",
              path: "/learners",
              permission: "users.read · suspend needs users.suspend",
              summary:
                "Find a student, read their enrollments and activity, then suspend or reactivate the account. Search matches name, email, phone, and id.",
              learner:
                "A suspended account cannot keep using the learner app. Reactivate restores it.",
              watch:
                "Suspend asks you to confirm. The button is red on purpose. Filters for state and batch sit above the table.",
              quiz: {
                prompt: "You need the lesson history for one student. What do you click?",
                choices: [
                  { text: "The learner's row, then read Activity", ok: true, why: "The row opens the profile, enrollments, and the activity feed." },
                  { text: "Suspend, so the feed freezes", ok: false, why: "Suspend blocks the account. It is not a way to view history." },
                  { text: "Reports, and export that one person", ok: false, why: "Reports is an institute snapshot, not one learner's timeline." },
                ],
              },
              steps: [
                {
                  title: "Search",
                  say: "Type a name, email, phone, or id. Use State or Batch when the list is long, and Reset to clear those filters.",
                  screen: "Learners",
                  blurb: "Search and manage learner accounts.",
                  controls: [
                    { label: "Search the table", kind: "ghost", correct: true },
                    { label: "Suspend", kind: "danger", hint: "Search first. Suspend is only on the open profile, and only when you mean to block them." },
                  ],
                },
                {
                  title: "Open the profile",
                  say: "Click the row. The side panel shows contact, batch, enrollments, and activity such as lessons and tests.",
                  screen: "Learner profile",
                  blurb: "Select a learner to inspect activity.",
                  controls: [
                    { label: "Open row", kind: "primary", correct: true },
                    { label: "Reset", kind: "ghost", hint: "Reset clears filters. The profile opens from the row." },
                  ],
                },
                {
                  title: "Suspend or restore",
                  say: "Suspend asks for confirmation. Reactivate is the orange button when the account is already suspended.",
                  screen: "Account actions",
                  blurb: "Needs users.suspend.",
                  controls: [
                    { label: "Reactivate", kind: "primary", correct: true },
                    { label: "Close the panel", kind: "ghost", hint: "Closing hides the profile. Reactivate is the action that restores access." },
                  ],
                },
              ],
            },
            {
              id: "staff",
              title: "Staff & roles",
              path: "/staff",
              permission: "admins.manage",
              summary:
                "Add a colleague and give them a role. Deactivate ends their access without deleting the history of what they did.",
              learner: "Staff accounts are not learner accounts. A learner password will not open this console.",
              watch: "Only people with admins.manage see this menu. Deactivate is reversible through Activate.",
              quiz: {
                prompt: "A teacher left the institute. What should you do with their staff row?",
                choices: [
                  { text: "Deactivate the staff account", ok: true, why: "Deactivate stops sign-in and keeps the audit trail attached to their name." },
                  { text: "Delete them from the audit log", ok: false, why: "The audit log is append-only. You do not erase past actions." },
                  { text: "Suspend them on the Learners screen", ok: false, why: "Learners and staff are different directories." },
                ],
              },
              steps: [
                {
                  title: "Add staff",
                  say: "Add staff opens a drawer. Enter their name, email, and role, then save. They sign in with the admin login, not the app.",
                  screen: "Staff & roles",
                  blurb: "Who can operate the console.",
                  controls: [
                    { label: "Add staff", kind: "primary", correct: true },
                    { label: "Deactivate", kind: "ghost", hint: "Deactivate is for someone already in the table." },
                  ],
                },
                {
                  title: "Turn access on or off",
                  say: "Each row shows roles and active or inactive. Deactivate blocks the console. Activate gives it back.",
                  screen: "Staff table",
                  blurb: "Roles decide which menus appear.",
                  controls: [
                    { label: "Deactivate", kind: "ghost", correct: true },
                    { label: "Add staff", kind: "primary", hint: "Add staff creates a new person. This step changes someone already listed." },
                  ],
                },
              ],
            },
            {
              id: "batches",
              title: "Batches",
              path: "/batches",
              permission: "users.read",
              summary:
                "A batch is a cohort: a name, an optional subject, and the learners on the roster. Live classes and filters use this group.",
              learner: "Learners see content and classes aimed at their batch. They do not edit the roster.",
              watch: "Edit batch roster is how you change membership. Creating a batch does not enroll anyone in a course by itself.",
              quiz: {
                prompt: "You want only one cohort in tomorrow's live class. What do you prepare first?",
                choices: [
                  { text: "A batch whose roster is the right students", ok: true, why: "Live classes can target a batch. The roster is maintained here." },
                  { text: "A coupon named after the cohort", ok: false, why: "Coupons change price. They do not group students." },
                  { text: "An explore section", ok: false, why: "Explore sections are home-screen links, not class rosters." },
                ],
              },
              steps: [
                {
                  title: "Create the batch",
                  say: "Add batch opens the drawer. Give it a name and a subject if you use one, then Create batch.",
                  screen: "Batches",
                  blurb: "Cohorts for classes and filters.",
                  controls: [
                    { label: "Add batch", kind: "primary", correct: true },
                    { label: "Edit roster", kind: "ghost", hint: "Edit roster is for a batch that already exists." },
                  ],
                },
                {
                  title: "Set the roster",
                  say: "On the row, Edit roster opens the same drawer with the people picker. Save batch when the names are right.",
                  screen: "Edit batch roster",
                  blurb: "Choose the learners in this cohort.",
                  controls: [
                    { label: "Save batch", kind: "primary", correct: true },
                    { label: "Add batch", kind: "ghost", hint: "You are editing. Save batch writes the roster." },
                  ],
                },
              ],
            },
          ],
        },
        {
          id: "learning",
          label: "Learning",
          items: [
            {
              id: "courses",
              title: "Courses",
              path: "/courses",
              permission: "content.edit · publish needs content.publish",
              summary:
                "A course is the container learners enroll in. You create a draft with a title and a stable slug, add lessons, then publish it.",
              learner:
                "Only a published course can show as available. A draft stays inside the console.",
              watch:
                "The slug is the stable address. Renaming the title later is safer than changing the slug, because links and enrollments follow the id.",
              quiz: {
                prompt: "The course looks right, but students still cannot see it. What is missing?",
                choices: [
                  { text: "Publish, after the draft has lessons", ok: true, why: "Create draft only stores it. Publish is what releases it." },
                  { text: "A new slug every time you edit the title", ok: false, why: "The slug should stay stable. Publishing changes visibility." },
                  { text: "An admit card", ok: false, why: "Admit cards are documents. They do not publish a course." },
                ],
              },
              steps: [
                {
                  title: "Create a draft",
                  say: "Create draft asks for a title and a slug. The course is saved as a draft in free mode until you publish.",
                  screen: "Courses",
                  blurb: "Create, edit, and publish learning courses.",
                  controls: [
                    { label: "Create draft", kind: "primary", correct: true },
                    { label: "Publish", kind: "ghost", hint: "Publish is on a row that already exists. Start with Create draft." },
                  ],
                },
                {
                  title: "Add a lesson stub",
                  say: "Add lesson on the row opens a form. Give the lesson a title and save it. Open Lessons & resources to upload the video or file.",
                  screen: "Course row",
                  blurb: "Title, slug, mode, lifecycle, lesson count.",
                  controls: [
                    { label: "Add lesson", kind: "ghost", correct: true },
                    { label: "Create draft", kind: "primary", hint: "Another draft would be a second course. This course needs Add lesson." },
                  ],
                },
                {
                  title: "Publish",
                  say: "Publish appears while the lifecycle is not published, and only if you have content.publish. After that, learners can be offered the course.",
                  screen: "Ready to release",
                  blurb: "Drafts stay private.",
                  controls: [
                    { label: "Publish", kind: "primary", correct: true },
                    { label: "Add lesson", kind: "ghost", hint: "You can add more lessons later. This step is the release." },
                  ],
                },
              ],
            },
            {
              id: "semesters",
              title: "Semesters",
              path: "/semesters",
              permission: "semester.review · approve needs semester.approve",
              summary:
                "Certification courses move semester by semester. You add the semester, collect a review, then approve and unlock the next stage or send it back.",
              learner:
                "Students see locked, available, in progress, or approved. They cannot approve themselves.",
              watch:
                "Approve & unlock is the academic decision. Request changes keeps the semester from advancing.",
              quiz: {
                prompt: "The submission is incomplete. Which button matches that decision?",
                choices: [
                  { text: "Request changes", ok: true, why: "Request changes sends it back. Approve & unlock moves them forward." },
                  { text: "Add semester", ok: false, why: "Add semester creates structure. It does not judge a submission." },
                  { text: "Publish on Courses", ok: false, why: "Course publish releases a catalog item. Semester approval is a learner's progress." },
                ],
              },
              steps: [
                {
                  title: "Add the semester",
                  say: "Add semester defines the next stage on a course: its index and title.",
                  screen: "Semesters & reviews",
                  blurb: "Structure first, then the review queue.",
                  controls: [
                    { label: "Add semester", kind: "primary", correct: true },
                    { label: "Approve & unlock", kind: "ghost", hint: "Approval is for a review that is already in the queue." },
                  ],
                },
                {
                  title: "File the review",
                  say: "Submit review records that a learner's semester is ready to be judged.",
                  screen: "Submit semester review",
                  blurb: "Moves the work into the queue.",
                  controls: [
                    { label: "Submit for review", kind: "primary", correct: true },
                    { label: "Request changes", kind: "ghost", hint: "Request changes is the decision after a review exists." },
                  ],
                },
                {
                  title: "Decide",
                  say: "Approve & unlock opens the next stage. Request changes asks the learner to fix the work.",
                  screen: "Review queue",
                  blurb: "Needs semester.approve to approve.",
                  controls: [
                    { label: "Approve & unlock", kind: "primary", correct: true },
                    { label: "Add semester", kind: "ghost", hint: "The semester already exists. This step is the decision." },
                  ],
                },
              ],
            },
            {
              id: "lessons",
              title: "Lessons & resources",
              path: "/lessons",
              permission: "content.edit",
              summary:
                "This is where files and videos attach to lessons. Upload a resource, wait until the video provider is ready, then preview it.",
              learner:

      const ITEMS = GROUPS.flatMap((g) => g.items.map((item) => ({ ...item, group: g.label, groupId: g.id })));
      const KEY = "redi.adminGuide.practiced.v1";
      const state = {
        id: null,
        step: 0,
        query: "",
        practiced: load(),
        quiz: null,
        hint: "",
        hintTone: "",
      };

      function load() {
        try {
          const v = JSON.parse(localStorage.getItem(KEY) || "{}");
          return v && typeof v === "object" ? v : {};
        } catch {
          return {};
        }
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(state.practiced));
      }
      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function current() {
        return ITEMS.find((i) => i.id === state.id) || null;
      }

      function renderNav() {
        const nav = document.getElementById("nav");
        nav.replaceChildren();
        const q = state.query.trim().toLowerCase();
        const home = el("button", "fn" + (state.id ? "" : " active"), "All functions");
        home.type = "button";
        home.addEventListener("click", () => {
          state.id = null;
          state.step = 0;
          state.hint = "";
          state.hintTone = "";
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
          render();
        });
        nav.appendChild(home);
        for (const group of GROUPS) {
          const items = group.items.filter((item) => {
            if (!q) return true;
            return (item.title + " " + item.summary + " " + item.path + " " + group.label)
              .toLowerCase()
              .includes(q);
          });
          if (!items.length) continue;
          nav.appendChild(el("div", "group-label", group.label));
          for (const item of items) {
            const b = el("button", "fn" + (state.id === item.id ? " active" : "") + (state.practiced[item.id] ? " learned" : ""));
            b.type = "button";
            b.append(document.createTextNode(item.title), el("i", "dot"));
            b.addEventListener("click", () => openItem(item.id));
            nav.appendChild(b);
          }
        }
        const done = ITEMS.filter((i) => state.practiced[i.id]).length;
        document.getElementById("count").textContent = String(done);
        document.getElementById("total").textContent = String(ITEMS.length);
        document.getElementById("bar").style.width = Math.round((done / ITEMS.length) * 100) + "%";
      }

      function openItem(id) {
        state.id = id;
        state.step = 0;
        state.quiz = null;
        state.hint = "Click the control this step is asking for.";
        state.hintTone = "";
        if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
        render();
      }

      function renderHome() {
        const stage = document.getElementById("stage");
        stage.replaceChildren();
        stage.append(
          el("p", "kicker", "Ranjan Educational Institute"),
          el("h1", null, "How an admin manages each function"),
          el(
            "p",
            "lead",
            "Pick a function on the left, or start below. Each one opens a small copy of that screen. Click the control the step names. A green dot means you have finished that practice.",
          ),
        );
        const chips = el("div", "chips");
        const day = el("button", "chip on", "Walk a normal day");
        day.type = "button";
        day.addEventListener("click", () => openItem("dashboard"));
        chips.appendChild(day);
        for (const g of GROUPS) {
          const c = el("button", "chip", g.label);
          c.type = "button";
          c.addEventListener("click", () => openItem(g.items[0].id));
          chips.appendChild(c);
        }
        stage.appendChild(chips);

        const legend = el("div", "legend");
        legend.append(el("i", "lg-o", "Orange — the main action"), el("i", "lg-b", "Blue outline — a secondary action"), el("i", "lg-r", "Red — block, revoke, or other destructive action"));
        stage.appendChild(legend);

        const grid = el("div", "grid");
        const habits = [
          ["Sign in is separate", "Admin email and password never open the learner app, and a learner token never opens this console."],
          ["Draft, then publish", "Courses, tests, banners, explore tiles, and articles stay private until you publish the row."],
          ["Menus follow permission", "A missing item means this account does not have that permission. The server checks the address too."],
          ["Drawers are the forms", "Create, issue, schedule, and save open a panel from the right. The table stays behind it."],
          ["Filters are local", "Search and the dropdowns narrow the table. Reset clears them. They do not delete records."],
          ["The log is append-only", "Fix a mistake on its own screen. The audit log keeps both the mistake and the fix."],
        ];
        for (const [t, d] of habits) {
          const card = el("article", "card");
          card.append(el("strong", null, t), el("small", null, d));
          grid.appendChild(card);
        }
        stage.appendChild(grid);

        const grid2 = el("div", "grid");
        grid2.style.marginTop = "14px";
        for (const item of ITEMS) {
          const card = el("button", "card");
          card.type = "button";
          card.append(el("span", "tag", item.group), el("strong", null, item.title), el("small", null, item.summary));
          card.addEventListener("click", () => openItem(item.id));
          grid2.appendChild(card);
        }
        stage.appendChild(grid2);
      }

      function renderDetail() {
        const item = current();
        const stage = document.getElementById("stage");
        stage.replaceChildren();
        const index = ITEMS.findIndex((i) => i.id === item.id);
        stage.append(el("p", "kicker", item.group), el("h1", null, item.title));
        const meta = el("div", "meta");
        meta.append(el("span", "pill path", item.path), el("span", "pill", item.permission));
        stage.appendChild(meta);

        const layout = el("div", "layout");
        const left = el("section", "panel");
        left.append(
          el("h2", null, "What this function is"),
          el("p", "say", item.summary),
          el("h2", null, "What the learner sees"),
          el("p", "say", item.learner),
        );
        const ol = el("ol", "steps");
        item.steps.forEach((step, i) => {
          const b = el("button", i === state.step ? "on" : "");
          b.type = "button";
          b.append(el("b", null, i + 1 + ". " + step.title), el("span", null, step.say));
          b.addEventListener("click", () => {
            state.step = i;
            state.hint = "Click the control this step is asking for.";
            state.hintTone = "";
            render();
          });
          const li = el("li");
          li.appendChild(b);
          ol.appendChild(li);
        });
        left.append(el("h2", null, "Do it in order"), ol, el("div", "watch", item.watch));

        const quiz = el("div", "quiz");
        quiz.append(el("h2", null, "Check yourself"), el("p", "say", item.quiz.prompt));
        item.quiz.choices.forEach((choice, i) => {
          const b = el("button", state.quiz === i ? (choice.ok ? "right" : "wrong") : "", choice.text);
          b.type = "button";
          b.addEventListener("click", () => {
            state.quiz = i;
            if (choice.ok) state.practiced[item.id] = true;
            save();
            render();
          });
          quiz.appendChild(b);
          if (state.quiz === i) quiz.append(el("p", choice.ok ? "hint ok" : "hint no", choice.why));
        });
        left.appendChild(quiz);

        const actions = el("div", "row-actions");
        if (index > 0) {
          const prev = el("button", "btn ghost", "Previous function");
          prev.type = "button";
          prev.addEventListener("click", () => openItem(ITEMS[index - 1].id));
          actions.appendChild(prev);
        }
        if (index < ITEMS.length - 1) {
          const next = el("button", "btn", "Next function");
          next.type = "button";
          next.addEventListener("click", () => openItem(ITEMS[index + 1].id));
          actions.appendChild(next);
        }
        const reset = el("button", "btn ghost", state.practiced[item.id] ? "Practiced" : "Mark practiced");
        reset.type = "button";
        reset.addEventListener("click", () => {
          if (state.practiced[item.id]) delete state.practiced[item.id];
          else state.practiced[item.id] = true;
          save();
          render();
        });
        actions.appendChild(reset);
        left.appendChild(actions);

        const right = el("section", "panel mock");
        const step = item.steps[state.step];
        const top = el("div", "mock-top");
        top.append(el("strong", null, "Practice screen"), el("span", "pill", "Step " + (state.step + 1) + " of " + item.steps.length));
        const screen = el("div", "mock-screen");
        screen.append(el("h3", null, step.screen), el("p", null, step.blurb), el("p", "say", step.say));
        const controls = el("div", "actions");
        for (const control of step.controls) {
          const b = el("button", "btn" + (control.kind === "primary" ? "" : " " + control.kind), control.label);
          b.type = "button";
          b.addEventListener("click", () => {
            if (control.correct) {
              state.hintTone = "ok";
              if (state.step < item.steps.length - 1) {
                state.hint = "That is the one. The next step is ready.";
                state.step += 1;
              } else {
                state.hint = "That completes the clicks for " + item.title + ". Answer the check below.";
                state.practiced[item.id] = true;
                save();
              }
            } else {
              state.hintTone = "no";
              state.hint = control.hint;
            }
            render();
          });
          controls.appendChild(b);
        }
        screen.appendChild(controls);
        const hint = el("div", "hint" + (state.hintTone ? " " + state.hintTone : ""), state.hint || "Click the control this step is asking for.");
        right.append(top, screen, hint);

        layout.append(left, right);
        stage.appendChild(layout);
      }

      function render() {
        renderNav();
        if (current()) renderDetail();
        else renderHome();
      }

      document.getElementById("q").addEventListener("input", (e) => {
        state.query = e.target.value;
        renderNav();
      });
      const start = location.hash.replace("#", "");
      if (ITEMS.some((item) => item.id === start)) {
        state.id = start;
        state.hint = "Click the control this step is asking for.";
        state.hintTone = "";
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement.id !== "q") {
          e.preventDefault();
          document.getElementById("q").focus();
        }
      });
      render();
    </script>
  </body>
</html>
